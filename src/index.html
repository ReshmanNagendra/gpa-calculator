<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator for Indian Universities</title>
    <meta name="description" content="Select your university to calculate your CGPA and SGPA using the official grading scale.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .university-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }
        .uni-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .uni-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .uni-name {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .uni-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <h1 style="margin-bottom: 0.5rem;">GPA Calculator</h1>
            <p>Select your university to get started</p>
        </header>

        <main>
            <div class="glass-panel" style="padding: 2rem;">
                <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Available Universities</h2>
                <div class="university-list" id="uni-list">
                    <!-- Injected by build.js -->
                </div>
            </div>
            
            <footer class="seo-footer" style="margin-top: 4rem; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; text-align: center; border-top: 1px solid var(--border-glass);">
                <div style="display: flex; justify-content: center; gap: 1.5rem;">
                    <a href="privacy-policy.html" style="color: var(--text-muted); text-decoration: underline;">Privacy Policy</a>
                    <a href="terms.html" style="color: var(--text-muted); text-decoration: underline;">Terms of Service</a>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
